[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-sentinel"
version = "2.0.1"
description = "Local-first desktop quota planner and conversation resumer for Codex"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["openai", "codex", "cli", "rate-limit", "daemon", "watcher", "developer-tools"]
authors = [
    { name = "Codex Sentinel Maintainers" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities"
]
dependencies = [
    "psutil>=5.9.0",
    "PySide6>=6.7.0,<7"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[project.urls]
Homepage = "https://github.com/isshui/codex-sentinel"
Repository = "https://github.com/isshui/codex-sentinel"
Issues = "https://github.com/isshui/codex-sentinel/issues"

[project.scripts]
codex-sentinel = "codex_sentinel.cli:main"

[project.gui-scripts]
codex-sentinel-gui = "codex_sentinel.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["codex_sentinel"]
