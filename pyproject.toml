[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-sentinel"
version = "0.1.0"
description = "Auto-resume OpenAI Codex after 5-hour rate limits: unattended zero-polling daemon & lock manager"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["openai", "codex", "cli", "rate-limit", "daemon", "watcher", "developer-tools"]
authors = [
    { name = "Codex Sentinel Maintainers" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities"
]
dependencies = [
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[project.urls]
Homepage = "https://github.com/isshui/codex-sentinel"
Repository = "https://github.com/isshui/codex-sentinel"
Issues = "https://github.com/isshui/codex-sentinel/issues"

[project.scripts]
codex-sentinel = "codex_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codex_sentinel"]
