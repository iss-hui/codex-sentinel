name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 xvfb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run pytest
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          xvfb-run -a pytest -v --tb=short tests/ > pytest_output.txt 2>&1
        else
          pytest -v --tb=short tests/ > pytest_output.txt 2>&1
        fi
      shell: bash

    - name: Print test log on failure
      if: failure()
      run: cat pytest_output.txt
      shell: bash

    - name: Annotate test failure
      if: failure()
      run: |
        grep -A 8 "FAILED " pytest_output.txt | head -n 9 | while IFS= read -r line; do
          if [ -n "$line" ]; then
            echo "::error title=PytestError::$line"
          fi
        done
      shell: bash
