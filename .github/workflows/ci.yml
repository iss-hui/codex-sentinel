name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 xvfb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run pytest
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        set -o pipefail
        if [ "$RUNNER_OS" = "Linux" ]; then
          xvfb-run -a pytest -v --tb=short tests/ 2>&1 | tee pytest_output.txt
        else
          pytest -v --tb=short tests/ 2>&1 | tee pytest_output.txt
        fi
      shell: bash

    - name: Report pytest output to Step Summary
      if: always()
      run: |
        echo "### Pytest output: ${{ matrix.os }} Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 100 pytest_output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
      shell: bash

    - name: Upload pytest log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
        path: pytest_output.txt
