name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build-pypi:
    name: Build Python Wheels & Sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release version
        shell: python
        run: |
          import os
          from pathlib import Path
          import runpy
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          runtime_version = runpy.run_path("codex_sentinel/__init__.py")["__version__"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}" or runtime_version != version:
              raise SystemExit(
                  f"Release tag {tag!r}, project version {version!r} and runtime version {runtime_version!r} must match."
              )
          print(f"Building release {tag}")

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: python -m build

      - name: Upload PyPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows Standalone EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Compile Windows EXE
        run: |
          pyinstaller --clean --noconfirm --onefile --name "codex-sentinel-windows-x64-${env:RELEASE_TAG}" --windowed run_sentinel.py
          python scripts/build_windows.py
          Move-Item -LiteralPath "dist/CodexSentinel-windows-x64.zip" -Destination "dist/CodexSentinel-windows-x64-${env:RELEASE_TAG}.zip"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ env.RELEASE_TAG }}
          path: |
            dist/codex-sentinel-windows-x64-${{ env.RELEASE_TAG }}.exe
            dist/CodexSentinel-windows-x64-${{ env.RELEASE_TAG }}.zip
          if-no-files-found: error

  build-linux-binary:
    name: Build Linux Standalone Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Compile Linux Binary
        run: |
          pyinstaller --clean --noconfirm --onefile --name "codex-sentinel-linux-x64-${RELEASE_TAG}" run_sentinel.py
          chmod +x "dist/codex-sentinel-linux-x64-${RELEASE_TAG}"

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin-${{ env.RELEASE_TAG }}
          path: dist/codex-sentinel-linux-x64-${{ env.RELEASE_TAG }}
          if-no-files-found: error

  build-macos-binary:
    name: Build macOS Standalone Binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Compile macOS Binary
        run: |
          pyinstaller --clean --noconfirm --onefile --name "codex-sentinel-macos-${RELEASE_TAG}" run_sentinel.py
          chmod +x "dist/codex-sentinel-macos-${RELEASE_TAG}"

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-bin-${{ env.RELEASE_TAG }}
          path: dist/codex-sentinel-macos-${{ env.RELEASE_TAG }}
          if-no-files-found: error

  create-github-release:
    name: Publish GitHub Release
    needs: [build-pypi, build-windows-exe, build-linux-binary, build-macos-binary]
    runs-on: ubuntu-latest
    steps:
      - name: Download PyPI artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: linux-bin-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Download macOS Binary
        uses: actions/download-artifact@v4
        with:
          name: macos-bin-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Publish Release with All Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Codex Sentinel ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
